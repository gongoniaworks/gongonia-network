name: Bingo de Gongonia — project checks

on:
  push:
    paths:
      - "projects/bingo-gongonia/engine/**"
      - "projects/bingo-gongonia/app/**"
      - ".github/workflows/bingo-engine-tests.yml"
  pull_request:
    paths:
      - "projects/bingo-gongonia/engine/**"
      - "projects/bingo-gongonia/app/**"
      - ".github/workflows/bingo-engine-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        working-directory: projects/bingo-gongonia/engine
        run: npm test
      - name: Build static app bundle
        working-directory: projects/bingo-gongonia/app
        run: npm run build
      - name: Check app JavaScript module syntax
        working-directory: projects/bingo-gongonia/app
        run: npm run check
      - name: Check deployed module JavaScript syntax
        working-directory: projects/bingo-gongonia/app
        run: node --check dist/src/main.js
